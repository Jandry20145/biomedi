spring:
  application:
    name: odontocare-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/odontocare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:odontocare}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  reporting:
    institution-name: ${REPORT_INSTITUTION_NAME:Institución académica demostrativa}
    system-name: ${REPORT_SYSTEM_NAME:OdontoCare 3D}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:1800}
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
